#:schema https://mise.jdx.dev/schema/mise.json

[settings]
auto_install = true
idiomatic_version_file_enable_tools = ["node", "ruby"]

[settings.ruby]
compile = false

[env]
HK_MISE = 1 # hk resolves tools via mise

[tools]
aube = "latest" # fast npm/yarn replacement; node stays mise-managed
herdr = "latest" # terminal agent multiplexer
hk = "latest" # git hooks
node = "lts"
pitchfork = "latest" # a CLI for managing daemons
python = "latest"
ruby = "latest"
ruff = "latest" # Python linter and formatter
terraform = "latest" # Projects can override the global default
uv = "latest" # Python packages, projects, and isolated CLI tools

"npm:hunkdiff" = "latest" # `hunk` diff viewer
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] } # `opencode` v2 CLI
"npm:firebase-tools" = "latest" # `firebase` CLI
# Chromium BiDi moved publishing from GitHub Actions to Google's CfT pipeline (upstream README).
"npm:@mermaid-js/mermaid-cli" = { version = "latest", allow_builds = ["puppeteer"], trust_policy_excludes = ["chromium-bidi@157.0.8090-0"] } # `mmdc` diagrams (snacks.image); Puppeteer downloads Chrome
"npm:skills" = "latest" # `skills` agent-skill manager (skills.sh)
"npm:@tobilu/qmd" = { version = "latest", allow_builds = ["better-sqlite3"] } # `qmd` doc search (needs native better-sqlite3 build)

[tasks.sync-agent-skills]
description = "Install and update agent skills in ~/.claude and ~/.agents"
run = '''
# Version-matched skills declared by packslip releases; prune only mise-owned links.
mise skills sync --dir ~/.claude/skills --prune
mise skills sync --dir ~/.agents/skills --prune
# `command -v` also passes for an inactive mise shim, so check the reported path.
if hunk_skill="$(hunk skill path hunk-review 2>/dev/null)" && [ -f "$hunk_skill" ]; then
  for skills_dir in ~/.claude/skills ~/.agents/skills; do
    mkdir -p "$skills_dir"
    ln -sfn "$(dirname "$hunk_skill")" "$skills_dir/hunk-review"
  done
fi
if command -v qmd >/dev/null; then
  qmd skill install --global --yes -f
fi
if command -v skills >/dev/null; then
  skills update --global --yes
fi
'''

[tasks.sync-shell-completions]
description = "Generate bash completions for tools that ship them"
run = '''
dir="${XDG_DATA_HOME:-$HOME/.local/share}/bash-completion/completions"
mkdir -p "$dir"
# bash-completion loads <cmd>.bash from here on first <cmd><TAB>.
# Keep the previous file if a generator fails.
generate() {
  cmd="$1"; shift
  if "$@" > "$dir/$cmd.bash.tmp"; then
    mv "$dir/$cmd.bash.tmp" "$dir/$cmd.bash"
  else
    rm -f "$dir/$cmd.bash.tmp"
  fi
}
# Not needed for packslip tools (activated mise completes them) or for
# mise itself (the Homebrew package installs its completion).
generate herdr herdr completion bash
generate ruff ruff generate-shell-completion bash
generate uv uv generate-shell-completion bash
generate uvx uvx --generate-shell-completion bash
generate hunk hunk completion bash
generate opencode opencode --completions bash
'''

[hooks]
postinstall = [
  { run = "mise run sync-agent-skills" },
  { run = "mise run sync-shell-completions" },
  { run = "hk install --global --mise" }, # install/update git hooks on tool install
]
